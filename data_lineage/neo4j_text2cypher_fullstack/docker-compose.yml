services:
  backend:
    build: { context: ./backend }
    env_file: [./backend/.env]
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/app/app
      # For LLM_PROVIDER=google ONLY: drop your service-account JSON at
      # ./backend/gcp-sa.json and UNCOMMENT the next line:
      # - ./backend/gcp-sa.json:/app/gcp-sa.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
  frontend:
    build: { context: ./frontend }
    env_file: [./frontend/.env]
    ports: ["5173:5173"]
    depends_on: [backend]
    volumes: ["./frontend/src:/app/src","./frontend/public:/app/public"]
    restart: unless-stopped
