[project]
name = "o2c-unbilled-databricks-free"
version = "0.1.0"
description = "Local uv runner for the Databricks Free O2C Unbilled demo (Track B). Not MetricFlow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk==0.128.0",
    "databricks-sql-connector==4.4.0",
    "psycopg[binary]==3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
package = true
