[project]
name = "downstream-pricing-databricks-free"
version = "0.1.0"
description = "Synthetic downstream pricing demo for Databricks Free Edition: Postgres sources, DuckDB replication, replica, silver star schema, gold, metric views, definitions views, four Genie agents and an orchestrator over them."
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.1",
    "psycopg[binary]==3.3.4",
    "pyarrow==21.0.0",
    "databricks-sdk==0.128.0",
    "databricks-sql-connector==4.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "rdflib==7.1.4"]  # rdflib: the tests read the committed technical graph
# The technical graph (pricing_demo/tech_graph.py): SPARQL Anything runs on Java and downloads its jar on first use.
graph = ["pysparql-anything==1.3.0.0", "neo4j==5.28.1", "rdflib==7.1.4"]
# The outside context (pricing_demo/outside.py): Parallel's Python SDK, for its client.post to the Decisions API.
outside = ["parallel-web==1.3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing_demo"]

[tool.uv]
package = true
