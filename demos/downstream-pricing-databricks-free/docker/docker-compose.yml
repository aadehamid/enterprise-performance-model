# One Postgres server with one database per source system. The pipeline reads SOURCE_PG_DSN, so the databases
# can move to another host (for example an exe.dev VM) without code changes.
services:
  sources:
    image: postgres:16.10
    container_name: pricing-demo-sources
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo  # a local, synthetic-only database; change it when the host is not your Mac
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
