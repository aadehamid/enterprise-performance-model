name: Markdown link check

on:
  push:
  pull_request:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links (case-sensitive)
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: file targets only. External URLs are cited throughout
          # Homelab/ADRs and are not a gate. Fragments are not required.
          args: >-
            --offline
            --no-progress
            '**/*.md'
          fail: true
