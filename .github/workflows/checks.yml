name: Checks

# Runs scripts/check.sh: the Step 4 evidence gate, every test script,
# epm-facts counts, the decision-record and quote checks, the names check, and the Step 4 pin check. The pre-push hook in
# scripts/hooks runs the same script locally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: test_published_figures.py checks EPM-DEC-001-0025
          # on the commit that record cites.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Keep uv's package cache between runs, so each check does not download its dependencies again.
          enable-cache: true
          cache-dependency-glob: scripts/check.sh
      - name: Run scripts/check.sh
        run: ./scripts/check.sh
